<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentaciones GIZ</title>
  <link rel="stylesheet" href="./src/palette.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    /* Marca de agua de fondo */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('presentaciones/assets/images/ganado.png') center center / contain no-repeat;
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--color-accent); }
    p.sub { color: var(--color-text-muted); margin-bottom: 2.5rem; }
    /* Tarjetas de navegación un 35% más grandes. */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.69rem; max-width: 1200px; width: 100%; }
    .card {
      display: block;
      text-decoration: none;
      color: var(--color-text);
      background: var(--color-surface);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 27px;
      padding: 2.36rem;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--color-accent); background: var(--color-surface-2); }
    .card h2 { font-size: 1.89rem; margin-bottom: 0.54rem; white-space: nowrap; }
    .card span { color: var(--color-text-muted); font-size: 1.22rem; }
    .dot { display: inline-block; width: 13.5px; height: 13.5px; border-radius: 50%; background: var(--color-accent); margin-right: 11px; }

    /* Logos (parte inferior) */
    .logos {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-top: 3.5rem;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 101px;     /* 45% más grande */
      padding: 0 1.8rem;
      background: #ffffff;
      border-radius: 18px;
    }
    .logo img {
      height: 64px;      /* 45% más grande — todos del mismo tamaño (misma altura) */
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* Pie de página discreto: créditos + enlace a Kuya Code */
    .site-footer {
      margin-top: 2.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      opacity: 0.55;
      transition: opacity 0.2s ease;
    }
    .site-footer:hover { opacity: 0.9; }
    .site-footer .credit {
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      color: var(--color-text-muted);
      text-align: center;
    }
    .site-footer .made-by {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      color: var(--color-text-muted);
      font-size: 0.82rem;
      transition: color 0.2s ease;
    }
    .site-footer .made-by:hover { color: var(--color-accent); }
    .site-footer .logo-icon {
      width: 18px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Presentaciones GIZ</h1>
  <p class="sub">Selecciona una presentación</p>
  <div class="cards">
    <a class="card" href="./presentaciones/procesos/">
      <h2><span class="dot"></span>Procesos</h2>
      <span>Diagnóstico y optimización de procesos</span>
    </a>
    <a class="card" href="./presentaciones/gobierno/">
      <h2><span class="dot"></span>Gobierno</h2>
      <span>Estructura de gobernanza</span>
    </a>
    <a class="card" href="./presentaciones/recomendaciones/">
      <h2><span class="dot"></span>Recomendaciones</h2>
      <span>Conclusiones y próximos pasos</span>
    </a>
  </div>

  <div class="logos">
    <span class="logo"><img src="presentaciones/assets/images/giz.png" alt="GIZ" /></span>
    <span class="logo"><img src="presentaciones/assets/images/sifae.png" alt="SIFAE" /></span>
    <span class="logo"><img src="presentaciones/assets/images/subastar.png" alt="Subastar" /></span>
    <span class="logo"><img src="presentaciones/assets/images/chone.png" alt="GAD Chone" /></span>
    <span class="logo"><img src="presentaciones/assets/images/ecudaor.png" alt="Ecuador" /></span>
  </div>
<footer class="site-footer">
  <span class="credit">Elaborado por Casigña Rolando · Bryan Sánchez</span>
  <span class="credit">Quito, Ecuador · Julio 2026</span>
  <a class="made-by" href="https://kuyacode.com/" target="_blank" rel="noopener noreferrer">
    <svg class="logo-icon" viewBox="0 0 40 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="18" y="34" width="4" height="12" rx="2" fill="currentColor"></rect>
      <line x1="20" y1="34" x2="20" y2="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
      <line x1="20" y1="24" x2="13" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
      <line x1="20" y1="24" x2="27" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
      <line x1="13" y1="16" x2="9" y2="9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></line>
      <line x1="13" y1="16" x2="17" y2="9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></line>
      <line x1="27" y1="16" x2="23" y2="9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></line>
      <line x1="27" y1="16" x2="31" y2="9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></line>
      <circle cx="9" cy="7" r="3.5" fill="currentColor"></circle>
      <circle cx="17" cy="7" r="3.5" fill="currentColor"></circle>
      <circle cx="23" cy="7" r="3.5" fill="currentColor"></circle>
      <circle cx="31" cy="7" r="3.5" fill="currentColor"></circle>
      <circle cx="13" cy="14" r="2.5" fill="currentColor" opacity="0.6"></circle>
      <circle cx="27" cy="14" r="2.5" fill="currentColor" opacity="0.6"></circle>
    </svg>
    kuyacode.com
  </a>
</footer>
</body>
</html>
